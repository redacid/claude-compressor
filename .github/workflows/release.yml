# A vX.Y.Z tag on main: checks, tests, build and a GitHub release with the zip,
# its sha256 and release notes built from the pull requests merged into main.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check tag (vX.Y.Z, on main, matches manifest versions)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          make release-check TAG="${{ github.ref_name }}"
      - name: Install rtk and Claude Code CLI
        run: scripts/ci/install-tools.sh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Validate manifests
        run: make validate
      - name: Build
        run: make package
      - name: Changelog
        run: make --silent changelog TAG="${{ github.ref_name }}" > dist/CHANGELOG.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 dist/CHANGELOG.md \
            --verify-tag --title "${{ github.ref_name }}" --notes-file dist/CHANGELOG.md

# Every push to any branch: lint, tests (with real rtk) and manifest validation.
name: ci

on:
  push:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install rtk and Claude Code CLI
        run: scripts/ci/install-tools.sh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Validate manifests
        run: make validate

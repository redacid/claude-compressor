# Every push to any branch: lint, tests (with real rtk) and manifest validation.
name: ci

on:
  push:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install rtk and Claude Code CLI
        if: matrix.node == 24
        run: scripts/ci/install-tools.sh
      - name: Install rtk for minimum Node version
        if: matrix.node == 18
        env:
          INSTALL_CLAUDE: '0'
        run: scripts/ci/install-tools.sh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Validate manifests
        if: matrix.node == 24
        run: make validate
